logging:
  config: 'classpath:log4j2.yml'

spring:
  application:
    name: hack-autumn-2026-api
  profiles:
    default: dev

app:
  dashboard:
    metrics-refresh-ms: 5000
  auth:
    # 256-битный ключ в Base64. В каждом окружении переопределяйте через APP_AUTH_JWT_SECRET.
    jwt-secret: ${APP_AUTH_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=}
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:30d}
    secure-cookie: ${APP_AUTH_SECURE_COOKIE:false}
    oidc:
      enabled: ${APP_AUTH_OIDC_ENABLED:false}
      success-redirect-uri: ${APP_AUTH_OIDC_SUCCESS_REDIRECT_URI:/}
#      registrations: {}

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/internal-openapi
  swagger-ui:
    csrf:
      enabled: true
    path: /api/v1/docs
    url: /api/v1/openapi

management:
  server:
    port: 33001
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 33000
