logging:
  config: 'classpath:log4j2.yml'

spring:
  application:
    name: hack-autumn-2026-api
  profiles:
    default: dev

app:
  ml:
    enabled: ${APP_ML_ENABLED:false}
    base-url: ${APP_ML_BASE_URL:http://ml-service:8000}
    service-token: ${APP_ML_SERVICE_TOKEN:}
    model-version: ${APP_ML_MODEL_VERSION:}
    request-timeout: ${APP_ML_REQUEST_TIMEOUT:2s}
    cache-ttl: ${APP_ML_CACHE_TTL:30s}
    max-history-events: ${APP_ML_MAX_HISTORY_EVENTS:100000}
  generator:
    enabled: ${APP_GENERATOR_ENABLED:false}
    use-for-dashboard: ${APP_GENERATOR_USE_FOR_DASHBOARD:false}
    source-id: ${APP_GENERATOR_SOURCE_ID:aeza-live}
    base-url: ${APP_GENERATOR_BASE_URL:http://generator-api:8000}
    service-token: ${APP_GENERATOR_SERVICE_TOKEN:}
    poll-delay-ms: ${APP_GENERATOR_POLL_DELAY_MS:1000}
    page-size: ${APP_GENERATOR_PAGE_SIZE:100}
    apply-batch-size: ${APP_GENERATOR_APPLY_BATCH_SIZE:1000}
    request-timeout: ${APP_GENERATOR_REQUEST_TIMEOUT:10s}
  dashboard:
    metrics-refresh-ms: 5000
  auth:
    # 256-битный ключ в Base64. В каждом окружении переопределяйте через APP_AUTH_JWT_SECRET.
    jwt-secret: ${APP_AUTH_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=}
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:30d}
    secure-cookie: ${APP_AUTH_SECURE_COOKIE:false}
    oidc:
      enabled: ${APP_AUTH_OIDC_ENABLED:false}
      success-redirect-uri: ${APP_AUTH_OIDC_SUCCESS_REDIRECT_URI:/}
#      registrations: {}

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/internal-openapi
  swagger-ui:
    csrf:
      enabled: true
    path: /api/v1/docs
    url: /api/v1/openapi

management:
  server:
    port: 33001
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 33000
