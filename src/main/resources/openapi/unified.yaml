      - name
      - score
      - level
      - status
      - monthlyPrice
      - event
      - autoRenew
    ClientServiceEvent:
      type: object
      description: Ближайшее событие услуги
      properties:
        type:
          type: string
          description: Ближайшее событие; для отсутствующего достоверного события поле event клиента равно null.
          enum:
          - renew
          - expire
          - delete
        date:
          type: string
          format: date
          description: Дата события в UTC
          example: '2026-10-24'
      required:
      - type
      - date
    LossBreakdown:
      type: object
      description: Расшифровка ожидаемых потерь по услугам
      properties:
        k:
          type: number
          format: double
          description: Коэффициент потерь из настроек модели
          example: 0.5
        uncoveredShare:
          type: number
          format: double
          description: Доля нехватки средств от 0 до 1
          example: 0.3
        items:
          type: array
          description: Вклад каждой услуги
          items:
            $ref: '#/components/schemas/LossBreakdownItem'
        horizonDays:
          type: integer
          minimum: 1
          maximum: 30
          description: Горизонт расчёта потребности в продлениях по настройкам правил; не окно целевой метки ML.
      required:
      - k
      - uncoveredShare
      - horizonDays
      - items
    LossBreakdownItem:
      type: object
      description: Вклад услуги в ожидаемые ежемесячные потери
      properties:
        serviceId:
          type: string
          description: ID услуги
        serviceName:
          type: string
          description: Название услуги
        monthlyPrice:
          type: number
          description: Стоимость в месяц в евро
        risk:
          type: number
          format: double
          description: Итоговый балл услуги / 100 после применимой поправки ML; НЕ вероятность CatBoost.
        loss:
          type: number
          description: Ожидаемая потеря в месяц в евро
      required:
      - serviceId
      - serviceName
      - monthlyPrice
      - risk
      - loss
    ClientPosition:
      type: object
      description: Позиция клиента в текущем отфильтрованном и отсортированном списке
      properties:
        index:
          type:
          - integer
          - 'null'
          format: int32
          description: Номер с 1; null, если клиент не прошёл фильтр
          minimum: 1
        total:
          type: integer
          format: int32
          description: Число клиентов после фильтрации
        prevId:
          type:
          - string
          - 'null'
          description: ID предыдущего клиента или null
        nextId:
          type:
          - string
          - 'null'
          description: ID следующего клиента или null
      required:
      - index
      - total
      - prevId
      - nextId
    NestedBillingService:
      type: object
      description: Услуга, вложенная в клиента; ownerId можно не указывать, сервер использует id клиента.
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный ID услуги
          example: 1
          minimum: 1
        name:
          type: string
          description: Название услуги
          example: hosting-1
        ownerId:
          type: integer
          format: int64
          description: ID клиента-владельца
          example: 1
          minimum: 1
        paymentTerm:
          type: string
          description: Платёжный период
          enum:
          - hour
          - day
          - week
          - month
          - quarter_year
          - half_year
          - year
          example: month
        autoProlong:
          type: boolean
          description: Автопродление включено
          example: true
        createdAt:
          type: string
          format: date-time
          description: Момент создания в UTC
        expiresAt:
          type: string
          format: date-time
          description: Момент окончания оплаченного периода в UTC
        status:
          type: string
          description: suspended — услуга выключена, но тарификация продолжается; prolong_wait — ожидание оплаты
            5 суток после expiresAt; deleted/blocked не могут быть продлены.
          enum:
          - active
          - suspended
          - prolong_wait
          - deleted
          - blocked
          example: active
        price:
          type: integer
          format: int64
          description: Стоимость одного периода оплаты в евроцентах, НЕ цена в месяц.
          example: 1200
          minimum: 0
      required:
      - id
      - name
      - paymentTerm
      - autoProlong
      - createdAt
      - expiresAt
      - status
      - price
    NestedBillingAccount:
      type: object
      description: Клиент со вложенными услугами — альтернативный формат импорта фронтенда.
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный ID клиента
          example: 1
          minimum: 1
        email:
          type: string
          description: Email клиента
          example: client@example.test
          format: email
        balance:
          type: integer
          format: int64
          description: 'balance: целое количество евроцентов (100 = €1).'
          example: 10000
          minimum: 0
        withdrawBalance:
          type: integer
          format: int64
          description: 'withdrawBalance: целое количество евроцентов (100 = €1).'
          example: 0
          minimum: 0
        totalReplenished:
          type: integer
          format: int64
          description: 'totalReplenished: целое количество евроцентов (100 = €1).'
          example: 10000
          minimum: 0
        bonusBalance:
          type: integer
          format: int64
          description: 'bonusBalance: целое количество евроцентов (100 = €1).'
          example: 0
          minimum: 0
        bonusState:
          type: string
          description: Статус бонусов
          enum:
          - locked
          - unlocked
          example: locked
        services:
          type: array
          items:
            $ref: '#/components/schemas/NestedBillingService'
      required:
      - id
      - email
      - balance
      - withdrawBalance
      - totalReplenished
      - bonusBalance
      - bonusState
      - services
    NestedRiskSnapshot:
      type: object
      required:
      - clients
      description: 'Дополнительно поддерживаемый бэком формат {clients: [{...account, services:[...]}], transactions:[...]}.'
      properties:
        clients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NestedBillingAccount'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
          default: []
    SourceSnapshot:
      oneOf:
      - $ref: '#/components/schemas/RiskSnapshot'
      - $ref: '#/components/schemas/NestedRiskSnapshot'
      description: Один из двух реально поддерживаемых форматов загрузки. Канонический формат ТЗ — RiskSnapshot.
        При работе из браузера передаётся файл как application/json целиком, НЕ multipart.
    PatchFactorWeights:
      type: object
      description: >-
        Только изменённые веса: ключ признака → новый вес 0–100. Ключ, которого нет в
        featureDefinitions, отклоняется с 422.
      additionalProperties:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
      minProperties: 1
      example:
        insufficientFunds: 55
    PatchRiskThresholds:
      type: object
      description: 'Порог LOW: score < medium; MEDIUM: medium <= score < high; HIGH: score >= high. Инвариант high
        > medium.'
      properties:
        medium:
          type: integer
          format: int32
          description: Минимальный score среднего риска
          example: 40
          maximum: 99
          minimum: 1
        high:
          type: integer
          format: int32
          description: Минимальный score высокого риска
          example: 70
          maximum: 100
          minimum: 2
      minProperties: 1
    PatchFinanceSettings:
      type: object
      description: Учёт балансов и коэффициент потерь от 0 до 1 с шагом 0.05
      properties:
        bonusesAsMoney:
          type: boolean
          description: Учитывать доступные бонусы как деньги
          example: true
        referralBalanceAsMoney:
          type: boolean
          description: Учитывать реферальный баланс как деньги
          example: false
        balanceLossFactor:
          type: number
          format: double
          description: Коэффициент потерь
          example: 0.5
          maximum: 1
          minimum: 0
          multipleOf: 0.05
      minProperties: 1
    PatchForecastSettings:
      type: object
      description: Горизонт прогноза и интервал обновления
      properties:
        horizonDays:
          type: integer
          format: int32
          description: Горизонт в днях
          example: 5
          maximum: 30
          minimum: 1
        recalculationIntervalMinutes:
          type: integer
          format: int32
          description: Интервал обновления в минутах
          example: 5
          maximum: 60
          minimum: 1
      minProperties: 1
    ModelSettingsChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        factorWeights:
          $ref: '#/components/schemas/PatchFactorWeights'
        riskThresholds:
          $ref: '#/components/schemas/PatchRiskThresholds'
        finance:
          $ref: '#/components/schemas/PatchFinanceSettings'
        forecast:
          $ref: '#/components/schemas/PatchForecastSettings'
    PatchModelSettingsRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - changes
      description: Оптимистическая блокировка. version обязателен; changes содержит только редактируемые группы/поля.
        Частичный PATCH объединяется с текущими настройками и запускает пересчёт.
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        changes:
          $ref: '#/components/schemas/ModelSettingsChanges'
