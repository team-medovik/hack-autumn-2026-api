      - id
      - label
      - level
      - clients
      - monthlyLoss
    RiskBucket:
      type: object
      description: Агрегат клиентов одного уровня риска.
      properties:
        level:
          type: string
          description: none — нет оценки (нет живых услуг), а не score=0.
          enum: *id012
          example: high
        clients:
          type: integer
          format: int32
          description: Количество клиентов этого уровня.
          example: 13
          minimum: 0
        monthlyLoss:
          type:
          - number
          - 'null'
          description: Ожидаемые ежемесячные потери клиентов уровня. Для none всегда null.
          example: 854.5
        changed:
          type: boolean
          description: Изменилась ли сумма потерь относительно предыдущего снимка.
