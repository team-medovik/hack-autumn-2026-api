          description: ID клиента в биллинге.
          example: '1321245'
        email:
          type: string
          description: Email клиента.
          example: client5@mail.ru
        score:
          type:
          - number
          - 'null'
          format: double
          description: Итоговый индекс риска 0–100 после применимой поправки ML; при fallback — балл алгоритма.
            НЕ вероятность потери. Для клиента — максимум по живым услугам. null означает отсутствие оценки.
          example: 94.2
          maximum: 100
          minimum: 0
        level:
          type: string
          description: none — нет оценки (нет живых услуг), а не score=0.
          enum: *id012
          example: high
        reason:
          type:
          - string
          - 'null'
          description: Главная человекочитаемая причина риска.
          example: Ожидает оплаты
        monthlyLoss:
          type: number
          description: Ожидаемая ежемесячная потеря, если клиент уйдёт.
          example: 14.4
        lossChanged:
          type: boolean
          description: Изменилась ли потеря относительно предыдущего снимка.
      required:
      - id
      - email
      - score
      - level
      - reason
      - monthlyLoss
      - lossChanged
    RiskQueue:
