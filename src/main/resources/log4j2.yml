Configuration:
  status: warn
  name: app-logger
  Properties:
    Property:
      - name: app-name
        value: "hack-autumn-2026-api"
      - name: log-path
        value: "logs/hack-autumn-2026-api"
      - name: log-archive-path
        value: ${log-path}/archive
      - name: log-file-pattern
        value: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%-5level] [%X{requestId}] [%t] %c{1} - %msg%n%throwable"
      - name: log-console-pattern
        value: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %highlight{[%-5level]}{FATAL=magenta, ERROR=red, WARN=yellow, INFO=green, DEBUG=cyan, TRACE=blue} [%X{requestId}] [%t] %c{1} - %msg%n%throwable"
      - name: log-file-extension-pattern
        value: "%d{yyyy-MM-dd}-%i"

  Appenders:
    RollingFile:
      - name: FILE_LOG
        fileName: ${log-path}.log
        filePattern: "${log-archive-path}/${app-name}.log.${log-file-extension-pattern}"
        PatternLayout:
          pattern: "${log-file-pattern}"
          disableAnsi: false
        DefaultRollOverStrategy:
          delete:
            basePath: "${log-archive-path}"
            maxDepth: 14
            IfLastModified:
              age: 14d
        Policies:
          TimeBasedTriggeringPolicy: {}
          SizeBasedTriggeringPolicy:
            size: 100 MB

    Console:
      name: CONSOLE_LOG
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "${log-console-pattern}"
        disableAnsi: false

  Loggers:
    Logger:
      - name: org.springframework.security
        level: warn
      - name: org.jooq
        level: warn
      - name: ru.medovik.hack2026.api
        level: info
    Root:
      level: info
      AppenderRef:
        - ref: CONSOLE_LOG
        - ref: FILE_LOG
